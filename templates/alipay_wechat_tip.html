{% extends "base.html" %}
{% block title %}请在浏览器中打开 - {{ settings.site_name }}{% endblock %}
{% block body %}
<div class="panel center">
  <h2>请在浏览器中打开付款</h2>
  <p>微信里打不开支付宝付款页。</p>
  <p>点右上角 <b>···</b>,选 <b>在浏览器中打开</b>,再点付款即可自动跳转到支付宝。</p>
  <p>订单号: <b>{{ order.out_trade_no }}</b></p>
  <p class="price-big">¥ {{ fmt_cents(order.total_cents) }}</p>
  <div class="btn-row center-row">
    <a class="btn" href="/order/{{ order.out_trade_no }}">查看订单</a>
  </div>
</div>
{% endblock %}
