services:
  shop:
    build: .
    container_name: fakawang
    restart: unless-stopped
    env_file: .env
    ports:
      # 只监听本机:公网必须经反代(Nginx/Caddy/Cloudflare Tunnel)访问,不要直接暴露
      # 宿主 8000 已被 yyb-go 占用,改用 8011
      - "127.0.0.1:8011:8000"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
